# Al subir una etiqueta (ej. v1.0.0): compila el ejecutable para cada sistema,
# lo prueba, lo publica como "Release" y luego prueba los instaladores de un solo comando.
name: Publicar versión

on:
  push:
    tags: ["v*"]

jobs:
  compilar:
    strategy:
      matrix:
        include:
          - { os: windows-latest,   asset: gestion-tareas-windows-x64.exe }
          - { os: ubuntu-22.04,     asset: gestion-tareas-linux-x64 }
          - { os: ubuntu-22.04-arm, asset: gestion-tareas-linux-arm64 }
          - { os: macos-latest,     asset: gestion-tareas-macos-arm64 }
          - { os: macos-15-intel,   asset: gestion-tareas-macos-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Pruebas de la app (robot de Textual)
        run: python tests/test_app.py
      # Textual y Rich cargan partes de sí mismos al vuelo: hay que pedirle a PyInstaller que las incluya todas
      - run: pyinstaller --onefile --name gestion-tareas --collect-submodules textual --collect-submodules rich --collect-data textual gestion_tareas.py
      - name: Probar el ejecutable (arranca y su versión coincide con la etiqueta)
        run: |
          exe=dist/gestion-tareas; [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" --version | grep -qxF "gestion-tareas ${GITHUB_REF_NAME#v}"
      - run: mv dist/gestion-tareas* "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Instrucciones de instalación en el README."
        env:
          GH_TOKEN: ${{ github.token }}

  probar-instalador:
    needs: publicar
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Instalar como lo haría una persona y comprobar la versión (Mac/Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
          ~/.local/bin/gestion-tareas --version | grep -qxF "gestion-tareas ${GITHUB_REF_NAME#v}"
      - name: Instalar como lo haría una persona y comprobar la versión (Windows, PowerShell 5)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
          $v = gestion-tareas --version
          if ($v -ne "gestion-tareas $($env:GITHUB_REF_NAME.TrimStart('v'))") { throw "Versión inesperada: $v" }
